[package]
name = "fm-migration"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fmblueprint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.42", features = ["encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
