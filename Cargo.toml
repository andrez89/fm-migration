[package]
name = "fm-migration"
version = "0.1.0"
edition = "2024"
authors = ["Andrez <andre@amovez.it>"]
description = "Offline analysis and documentation for FileMaker XML exports"
license = "MIT"
readme = "README.md"

[[bin]]
name = "fmblueprint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.9" }
quick-xml = { version = "0.42", features = ["encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
